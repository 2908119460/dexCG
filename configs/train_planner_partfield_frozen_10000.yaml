training_authorized: true
seed: 42
epochs: 20
model_config: configs/model/dexcg_planner_single_frame.yaml
batch_size_per_gpu: 5
num_workers: 2
prefetch_factor: 2
pin_memory: true
mixed_precision: bf16
gradient_accumulation_steps: 1
gradient_clip_norm: 1.0
data:
  split: train
  split_seed: 42
  history_interval: 8
  use_previous_contact: false
  paths:
  - data/dexart-object-balanced-10000-point/faucet_expert.zarr
  - data/dexart-object-balanced-10000-point/bucket_expert.zarr
  - data/dexart-object-balanced-10000-point/laptop_expert.zarr
  - data/dexart-object-balanced-10000-point/toilet_expert.zarr
  deployment_instructions:
    faucet: Rotate the faucet handle to open it.
    bucket: Lift the bucket by its rim.
    laptop: Open the laptop lid.
    toilet: Open the toilet lid.
optimizer:
  learning_rates:
    qwen: 1.0e-05
    point_projector: 0.0001
    robot_state_projector: 0.0001
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.95
  epsilon: 1.0e-08
  warmup_steps: 200
  scheduler: cosine
validation:
  enabled: true
  interval_epochs: 1
  language_families:
  - deployment
  selection_family: deployment
  selection_metric: composite_contact
  position_score_scale_m: 0.1
  diagnostic_batch_size: 3
  reference_result: null
  generation_samples_per_task: 8
  early_stopping:
    enabled: false
    patience: 2
    min_delta: 0.001
checkpoint:
  interval_epochs: 1
  keep_validation_best: 1
  keep_generation_best: 2
  keep_top: 3
policy_checkpoint: null
diffusion:
  num_train_timesteps: 100
  num_inference_steps: 10
  beta_start: 0.0001
  beta_end: 0.02
  beta_schedule: squaredcos_cap_v2
  prediction_type: epsilon
evaluation:
  enabled: false
  split: seen
  first_epoch: 100
  interval_epochs: 100
  seeds:
  - 1000
  - 1001
  - 1002
  - 1003
  - 1004
  episodes_per_seed: 20
  action_steps: 8
  tasks:
    faucet:
      instruction: Rotate the faucet handle to open it.
      max_steps: 50
    bucket:
      instruction: Lift the bucket by its rim.
      max_steps: 100
    laptop:
      instruction: Open the laptop lid.
      max_steps: 50
    toilet:
      instruction: Open the toilet lid.
      max_steps: 50
output_dir: outputs/qwen-partfield-frozen-10000
resume: false
freeze_partfield: true
