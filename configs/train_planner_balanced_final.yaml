# Full fine-tuning authorized by the user; output creation confirmed separately.
# Four-GPU DDP batch sweep (2026-09-16, shared GPUs 1,2,4,7):
# per-GPU batch 2/3/4/5 -> about 8.1/11.4/14.3/16.6 samples/s globally.
# Batch 5: global batch 20, peak allocated 28.1 GiB per GPU;
# minimum observed free memory after allocator reservation was 3.5 GiB.
training_authorized: true
seed: 42
epochs: 20
model_config: configs/model/dexcg_planner_single_frame.yaml
batch_size_per_gpu: 5
num_workers: 2
prefetch_factor: 2
pin_memory: true
mixed_precision: bf16
gradient_accumulation_steps: 1
gradient_clip_norm: 1.0

data:
  split: train
  split_seed: 42
  history_interval: 8
  use_previous_contact: false
  paths:
    - data/dexart-object-balanced-250/faucet_expert.zarr
    - data/dexart-object-balanced-250/bucket_expert.zarr
    - data/dexart-object-balanced-250/laptop_expert.zarr
    - data/dexart-object-balanced-250/toilet_expert.zarr
  deployment_instructions:
    faucet: Rotate the faucet handle to open it.
    bucket: Lift the bucket by its rim.
    laptop: Open the laptop lid.
    toilet: Open the toilet lid.

optimizer:
  # Matched 4-GPU pilots: 120 updates, global batch 20, warmup 10;
  # validation: 100 frames across all 50 objects, generation: 50 frames.
  # LR multiplier 1/2/4 -> macro CE 2.569/2.565/2.497,
  # link F1 .499/.461/.528, matched-link XYZ error .126/.139/.164 m.
  # User-approved 20-epoch follow-up: reuse the previous run's peak learning rates.
  # Cosine decay now spans 20 epochs; these rates are not established as optimal.
  learning_rates:
    qwen: 1.0e-5
    partfield: 5.0e-6
    point_projector: 1.0e-4
    robot_state_projector: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.95]
  epsilon: 1.0e-8
  warmup_steps: 200
  scheduler: cosine

validation:
  enabled: true
  interval_epochs: 1
  language_families: [deployment]
  selection_family: deployment
  selection_metric: composite_contact
  position_score_scale_m: 0.10
  diagnostic_batch_size: 3
  reference_result: outputs/qwen-finetuned-balanced/language_diagnostic_e0003.json
  generation_samples_per_task: 8
  early_stopping:
    enabled: false
    patience: 2
    min_delta: 0.001

checkpoint:
  interval_epochs: 1
  keep_validation_best: 1
  keep_generation_best: 2
  keep_top: 3

policy_checkpoint: null # Stage 1 trains contacts without loading the old action policy.
diffusion:
  num_train_timesteps: 100
  num_inference_steps: 10
  beta_start: 1.0e-4
  beta_end: 2.0e-2
  beta_schedule: squaredcos_cap_v2
  prediction_type: epsilon

evaluation:
  enabled: false
  split: seen
  first_epoch: 100
  interval_epochs: 100
  seeds: [1000, 1001, 1002, 1003, 1004]
  episodes_per_seed: 20
  action_steps: 8
  tasks:
    faucet:
      instruction: Rotate the faucet handle to open it.
      max_steps: 50
    bucket:
      instruction: Lift the bucket by its rim.
      max_steps: 100
    laptop:
      instruction: Open the laptop lid.
      max_steps: 50
    toilet:
      instruction: Open the toilet lid.
      max_steps: 50

output_dir: outputs/qwen-finetuned-balanced-20ep
resume: false
