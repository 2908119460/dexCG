[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexcg"
version = "0.1.0"
description = "Contact-graph-conditioned skill mixture policy for dexterous manipulation"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "accelerate>=1.2",
    "dexart",
    "diffusers>=0.35,<0.36",
    "easydict>=1.13",
    "einops>=0.8",
    "gym==0.23.1",
    "huggingface-hub>=0.34",
    "numcodecs>=0.11,<0.16",
    "numpy>=1.26,<2",
    "open3d==0.18.0",
    "pillow>=10",
    "pyyaml>=6.0",
    "sapien==2.2.1",
    "safetensors>=0.5",
    "scipy>=1.11",
    "setuptools>=68,<81",
    "termcolor>=2.4",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "tqdm>=4.66",
    "transforms3d>=0.4.2",
    "transformers>=4.57,<5",
    "zarr>=2.18,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
dexart = { path = "third_party/dexart", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["src/dexcg/models/contact/partfield/modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
